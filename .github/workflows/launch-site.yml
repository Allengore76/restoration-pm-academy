name: Expand Restoration PM Academy Source

on:
  push:
    branches:
      - main
    paths:
      - "bootstrap/ready"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restoration-pm-academy-source
  cancel-in-progress: false

jobs:
  expand:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand staged site bundle
        shell: bash
        run: |
          cat bootstrap/part-* > /tmp/restoration-pm-academy.tar.gz.b64
          base64 --decode /tmp/restoration-pm-academy.tar.gz.b64 > /tmp/restoration-pm-academy.tar.gz
          echo "782b3d1616554bdf4a3c53bf6a2b67df0418d7a9bc72e79c1873cfe2d9260657  /tmp/restoration-pm-academy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/restoration-pm-academy.tar.gz -C .
          rm -rf bootstrap

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the application
        run: npm run check

      - name: Commit expanded application source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch interactive academy pilot"
          git push

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#171a1f" />
  <title>Restoration PM Academy</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #171a1f; color: #fff; font-family: Inter, system-ui, sans-serif; }
    main { width: min(560px, 100%); padding: 36px; border: 1px solid rgba(255,255,255,.12); border-radius: 22px; background: rgba(255,255,255,.06); text-align: center; }
    .mark { width: 54px; height: 54px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 12px; background: #b72d2a; font: 700 32px Georgia, serif; }
    h1 { margin: 0; font: 600 34px/1.05 Georgia, serif; }
    p { color: #cdd1d7; }
    .bar { height: 6px; margin-top: 25px; overflow: hidden; border-radius: 999px; background: #363b43; }
    .bar::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: #b72d2a; animation: load 1.1s ease-in-out infinite alternate; }
    #error { display: none; margin-top: 18px; color: #ffd7d4; }
    @keyframes load { to { transform: translateX(138%); } }
  </style>
</head>
<body>
  <main>
    <div class="mark">R</div>
    <h1>Restoration PM Academy</h1>
    <p>Loading the interactive academy…</p>
    <div class="bar" aria-hidden="true"></div>
    <p id="error">The academy could not load in this browser. Please use a current version of Chrome, Edge, Firefox, or Safari.</p>
  </main>
  <script>window.__RPA_BUNDLE_PARTS = [];</script>
  <script src="./bundle-0.js"></script>
  <script src="./bundle-1.js"></script>
  <script src="./bundle-2.js"></script>
  <script src="./bundle-3.js"></script>
  <script src="./bundle-4.js"></script>
  <script>
    (async () => {
      try {
        if (!("DecompressionStream" in window)) throw new Error("gzip decompression is unavailable");
        const encoded = window.__RPA_BUNDLE_PARTS.join("");
        const binary = atob(encoded);
        const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const academy = await new Response(stream).text();
        document.open();
        document.write(academy);
        document.close();
      } catch (error) {
        console.error(error);
        document.getElementById("error").style.display = "block";
        document.querySelector(".bar").style.display = "none";
      }
    })();
  </script>
</body>
</html>
